<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Accuracy King</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="mainPage">
  <div class="top-actions">
    <button class="icon-btn" id="refreshBtn" onclick="manualRefresh()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/>
        <path d="M21 3v5h-5"/>
      </svg>
      Refresh
    </button>
  </div>

  <div class="header">
    <h1>Logicless Predictor</h1>
    <div class="sub">Accuracy King</div>
  </div>

  <div id="timer">
    <span class="dot"></span>
    <span class="label">Timer</span>
    <span class="time" id="timerText">00:00</span>
  </div>

  <div class="predictor-box">
    <div class="label">Prediction</div>
    <div id="predictionText" class="prediction-display none">No Trade</div>
    <div class="toggle-row">
      <input type="checkbox" id="beepToggle" checked>
      <label for="beepToggle">Beep On/Off</label>
    </div>
    <audio id="beepSound" src="https://www.soundjay.com/buttons_c2026/sounds/beep-01a.mp3"></audio>
  </div>

  <div class="box">
    <h2>Last 10 Results</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Period</th><th>Number</th><th>Big/Small</th></tr>
        </thead>
        <tbody id="liveResults"></tbody>
      </table>
    </div>
  </div>

  <div class="box">
    <h2>Manual Search</h2>
    <input class="search" type="text" id="manualSeq" placeholder="Enter sequence" inputmode="numeric">
    <button class="search-btn" onclick="manualSearch()">Search</button>
    <div id="manualResult"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
